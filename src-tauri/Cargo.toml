[package]
name = "nostra"
version = "0.1.0"
description = "Nostra desktop AI chat app"
authors = ["yunxinx"]
edition = "2021"
# Application crate, never published to a registry.
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name conflict on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "nostra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2.9.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["sync"] }
log = "0.4.34"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
# Renamed from significant_drop_tearing in current clippy
significant_drop_tightening = "warn"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
