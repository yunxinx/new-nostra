[advisories]
version = 2
yanked = "deny"
ignore = [
  # All entries below are "unmaintained" advisories (no vulnerability) for
  # transitive crates we cannot replace directly.
  # Review date: 2027-09-07 (re-check after Tauri migrates off GTK3 bindings).
  # gtk-rs GTK3 bindings, pinned by wry/tauri on the Linux target:
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  # unic-* and proc-macro-error, pinned transitively:
  "RUSTSEC-2024-0370",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]

[licenses]
version = 2
# nostra is an unpublished application crate (not distributed as a library);
# its own manifest carries no license expression.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",  # clipboard-win (Windows clipboard backend of arboard)
  "CDLA-Permissive-2.0",  # webpki-roots (bundled CA root store data)
  "ISC",
  "MPL-2.0",  # servo cssparser family via tauri-utils dom_query
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
