name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        timeout-minutes: 5
      - run: pnpm format:check
        timeout-minutes: 5
      - run: pnpm typecheck
        timeout-minutes: 5
      - run: pnpm test
        timeout-minutes: 10
      - run: pnpm knip
        timeout-minutes: 5

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the toolchain pinned by rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # Tauri links against webkit2gtk on Linux even for compile-only checks.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: cargo fmt --all --check
        timeout-minutes: 5
        working-directory: src-tauri
      - run: cargo clippy --workspace --all-targets -- -D warnings
        timeout-minutes: 20
        working-directory: src-tauri
      - run: cargo test --workspace
        timeout-minutes: 15
        working-directory: src-tauri
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./src-tauri/Cargo.toml
          arguments: --all-features
      - uses: bnjbvr/cargo-machete@v0.9.2
        with:
          args: --skip-target-dir
